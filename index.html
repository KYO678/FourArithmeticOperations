<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしい さんすう 🎓</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .operation-selector {
            display: flex;
            flex-direction: column;
            gap: 30px;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .operation-card {
            display: block;
            text-decoration: none;
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .operation-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .operation-card:active {
            transform: translateY(-2px);
        }

        .addition-card {
            background: linear-gradient(135deg, #a8e6cf 0%, #3dd5a7 100%);
        }

        .subtraction-card {
            background: linear-gradient(135deg, #ffd3a5 0%, #fd6585 100%);
        }

        .operation-icon {
            font-size: 5em;
            margin-bottom: 15px;
            display: block;
        }

        .operation-title {
            font-size: 3em;
            font-weight: bold;
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .operation-description {
            font-size: 1.3em;
            color: rgba(255, 255, 255, 0.9);
        }

        .main-title {
            text-align: center;
            font-size: 3em;
            color: #ff6b6b;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            animation: bounce 2s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        .intro-text {
            text-align: center;
            font-size: 1.8em;
            color: #4ecdc4;
            margin-bottom: 40px;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2em;
            }

            .intro-text {
                font-size: 1.4em;
            }

            .operation-title {
                font-size: 2.5em;
            }

            .operation-icon {
                font-size: 4em;
            }

            .operation-description {
                font-size: 1.1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="main-title">🌟 たのしい さんすう 🌟</h1>

        <p class="intro-text">どれで あそぶ？</p>

        <div class="operation-selector">
            <a href="addition.html" class="operation-card addition-card">
                <span class="operation-icon">➕</span>
                <div class="operation-title">たしざん</div>
                <div class="operation-description">かずを あわせよう！</div>
            </a>

            <a href="subtraction.html" class="operation-card subtraction-card">
                <span class="operation-icon">➖</span>
                <div class="operation-title">ひきざん</div>
                <div class="operation-description">かずを とろう！</div>
            </a>
        </div>
    </div>
</body>
</html>
