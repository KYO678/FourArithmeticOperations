<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>たのしい たしざん 🍎</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🌟 たのしい たしざん 🌟</h1>

        <!-- Step 1: 最初の数を選ぶ -->
        <div id="step1" class="step active">
            <h2 class="question">1つめの かずを えらんでね！</h2>
            <div class="number-buttons">
                <button class="num-btn" onclick="selectFirstNumber(1)">1</button>
                <button class="num-btn" onclick="selectFirstNumber(2)">2</button>
                <button class="num-btn" onclick="selectFirstNumber(3)">3</button>
                <button class="num-btn" onclick="selectFirstNumber(4)">4</button>
                <button class="num-btn" onclick="selectFirstNumber(5)">5</button>
                <button class="num-btn" onclick="selectFirstNumber(6)">6</button>
                <button class="num-btn" onclick="selectFirstNumber(7)">7</button>
                <button class="num-btn" onclick="selectFirstNumber(8)">8</button>
                <button class="num-btn" onclick="selectFirstNumber(9)">9</button>
                <button class="num-btn" onclick="selectFirstNumber(10)">10</button>
            </div>
        </div>

        <!-- Step 2: 2番目の数を選ぶ -->
        <div id="step2" class="step">
            <h2 class="question">2つめの かずを えらんでね！</h2>
            <div class="number-buttons">
                <button class="num-btn" onclick="selectSecondNumber(1)">1</button>
                <button class="num-btn" onclick="selectSecondNumber(2)">2</button>
                <button class="num-btn" onclick="selectSecondNumber(3)">3</button>
                <button class="num-btn" onclick="selectSecondNumber(4)">4</button>
                <button class="num-btn" onclick="selectSecondNumber(5)">5</button>
                <button class="num-btn" onclick="selectSecondNumber(6)">6</button>
                <button class="num-btn" onclick="selectSecondNumber(7)">7</button>
                <button class="num-btn" onclick="selectSecondNumber(8)">8</button>
                <button class="num-btn" onclick="selectSecondNumber(9)">9</button>
                <button class="num-btn" onclick="selectSecondNumber(10)">10</button>
            </div>
        </div>

        <!-- Step 3: 視覚的に表示 -->
        <div id="step3" class="step">
            <div class="visual-area">
                <div class="group" id="group1">
                    <div class="group-label" id="label1"></div>
                    <div class="objects-container" id="objects1"></div>
                </div>

                <div class="plus-sign">➕</div>

                <div class="group" id="group2">
                    <div class="group-label" id="label2"></div>
                    <div class="objects-container" id="objects2"></div>
                </div>
            </div>

            <button class="calculate-btn" onclick="calculateResult()">
                あわせると いくつ？ 🎈
            </button>
        </div>

        <!-- Step 4: 結果を表示 -->
        <div id="step4" class="step">
            <div class="result-area">
                <h2 class="answer-label">こたえは...</h2>
                <div class="answer-display">
                    <div class="equation" id="equation"></div>
                    <div class="big-answer" id="bigAnswer"></div>
                </div>
                <div class="all-objects" id="allObjects"></div>
            </div>

            <button class="reset-btn" onclick="resetGame()">
                もういちど やる！ 🎉
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
